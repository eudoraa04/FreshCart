<!DOCTYPE html>
<html>
<head>
    <title>FreshCart - Your Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <p>Your Shopping Cart</p>

<main>

    </div>
</main>

<script src="script.js"></script>

</body>
</html>
